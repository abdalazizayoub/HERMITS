<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERMITS — Service Desk Autopilot</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #030712; color: #f3f4f6; font-family: ui-sans-serif, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = 'http://localhost:8080';

async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

// ── Style maps ────────────────────────────────────────────────────────────────

const PRI_CLS = {
  critical: 'bg-red-900/50 text-red-300 border border-red-800',
  high:     'bg-orange-900/50 text-orange-300 border border-orange-800',
  medium:   'bg-yellow-900/50 text-yellow-300 border border-yellow-800',
  low:      'bg-green-900/50 text-green-300 border border-green-800',
};
const STA_CLS = {
  open:        'bg-blue-900/50 text-blue-300',
  in_progress: 'bg-purple-900/50 text-purple-300',
  done:        'bg-green-900/50 text-green-300',
  resolved:    'bg-green-900/50 text-green-300',
  closed:      'bg-gray-700 text-gray-400',
};
const RSK_CLS = {
  high:   'bg-red-900/50 text-red-300 border border-red-800',
  medium: 'bg-yellow-900/50 text-yellow-300 border border-yellow-800',
  low:    'bg-green-900/50 text-green-300 border border-green-800',
};
const CAT_CLS = {
  recon:               'text-cyan-400',
  execution:           'text-yellow-400',
  validation:          'text-purple-400',
  approval:            'text-green-400',
  activity_submission: 'text-blue-400',
  session:             'text-gray-400',
};

// ── Tiny helpers ──────────────────────────────────────────────────────────────

function Badge({ text, cls }) {
  return (
    <span className={`text-xs font-mono px-1.5 py-0.5 rounded uppercase tracking-wide ${cls || 'bg-gray-700 text-gray-400'}`}>
      {text}
    </span>
  );
}

function Spinner({ size = 'sm' }) {
  const dim = size === 'sm' ? 'w-3.5 h-3.5' : 'w-5 h-5';
  return <div className={`inline-block ${dim} border-2 border-cyan-500 border-t-transparent rounded-full animate-spin`} />;
}

function Err({ msg, onDismiss }) {
  if (!msg) return null;
  return (
    <div className="rounded-lg bg-red-900/30 border border-red-800 px-4 py-3 text-red-300 text-sm flex items-start justify-between gap-3">
      <span>⚠ {msg}</span>
      {onDismiss && <button onClick={onDismiss} className="text-red-500 hover:text-red-300 flex-none">✕</button>}
    </div>
  );
}

// ── Audit Log (Category C) ────────────────────────────────────────────────────

function AuditLog({ ticketId }) {
  const [entries, setEntries] = useState([]);
  const bottomRef = useRef(null);
  const prevLen   = useRef(0);

  useEffect(() => {
    if (!ticketId) return;
    const poll = () =>
      apiFetch(`/api/agent/audit/${ticketId}`)
        .then(d => setEntries(Array.isArray(d) ? d : []))
        .catch(() => {});
    poll();
    const id = setInterval(poll, 2000);
    return () => clearInterval(id);
  }, [ticketId]);

  useEffect(() => {
    if (entries.length > prevLen.current) {
      bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
    }
    prevLen.current = entries.length;
  }, [entries.length]);

  return (
    <div className="flex flex-col h-full bg-gray-900 border-l border-gray-800">
      <div className="flex-none px-4 py-3 border-b border-gray-800">
        <h2 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Audit Log</h2>
        <p className="text-xs text-gray-600 mt-0.5">{entries.length} event{entries.length !== 1 ? 's' : ''} · live</p>
      </div>
      <div className="flex-1 overflow-y-auto p-3 space-y-2 font-mono text-xs">
        {entries.length === 0 && (
          <p className="text-gray-700 italic py-6 text-center">No events yet…</p>
        )}
        {entries.map((e, i) => (
          <div key={i} className="rounded bg-gray-800/60 p-2.5 border border-gray-700/40">
            <div className="flex items-center justify-between gap-1 mb-1">
              <span className={`font-semibold truncate ${CAT_CLS[e.category] || 'text-gray-400'}`}>
                {e.action}
              </span>
              {e.exit_code != null && (
                <span className={`flex-none text-xs px-1 rounded ${e.exit_code === 0 ? 'text-green-400' : 'text-red-400'}`}>
                  ={e.exit_code}
                </span>
              )}
            </div>
            {e.command && (
              <p className="text-gray-300 break-all leading-relaxed">{e.command.slice(0, 140)}</p>
            )}
            {e.result && (
              <p className="text-gray-500 break-all mt-0.5 leading-relaxed">{e.result.slice(0, 100)}</p>
            )}
            <p className="text-gray-700 mt-1">
              {e.actor} · {new Date(e.timestamp).toLocaleTimeString()}
            </p>
          </div>
        ))}
        <div ref={bottomRef} />
      </div>
    </div>
  );
}

// ── Fix Step Card (Category D) ────────────────────────────────────────────────

function FixStepCard({ step, index, total, isActive, anyExecuting, onApprove, onAbort }) {
  const [editing, setEditing] = useState(false);
  const [editCmd, setEditCmd] = useState(step.command);

  const isExec    = step.status === 'executing';
  const isDone    = step.status === 'done';
  const isDeclined = step.status === 'declined';
  const showBtns  = isActive && step.status === 'pending' && !anyExecuting;

  const statusIcon = isExec ? '⟳'
    : isDone   ? (step.result?.blocked ? '🚫' : step.result?.exit_code === 0 ? '✅' : '⚠️')
    : isDeclined ? '⬛'
    : isActive ? '▶' : '○';

  return (
    <div className={`rounded-lg border p-4 transition-all duration-200 ${
      isExec     ? 'border-cyan-700 bg-gray-800/90' :
      isActive   ? 'border-cyan-800 bg-gray-800/70' :
      isDone     ? 'border-gray-700 bg-gray-900/50 opacity-75' :
      isDeclined ? 'border-gray-800 bg-gray-900/30 opacity-40' :
                   'border-gray-800 bg-gray-900/40'
    }`}>
      <div className="flex items-center justify-between gap-3 mb-2">
        <div className="flex items-center gap-2">
          <span className="text-sm leading-none">{statusIcon}</span>
          <span className="text-xs text-gray-500 font-mono">Step {index}/{total}</span>
          <Badge
            text={step.risk_level || 'unknown'}
            cls={RSK_CLS[(step.risk_level || '').toLowerCase()] || 'bg-gray-700 text-gray-400'}
          />
        </div>
        {isExec && <Spinner />}
      </div>

      {editing ? (
        <textarea
          className="w-full bg-gray-700 text-green-300 font-mono text-sm rounded p-2 mb-2 border border-cyan-600 resize-y focus:outline-none"
          rows={3}
          value={editCmd}
          onChange={e => setEditCmd(e.target.value)}
          autoFocus
        />
      ) : (
        <pre className="text-green-300 font-mono text-sm bg-black/30 rounded p-2.5 mb-2 overflow-x-auto whitespace-pre-wrap break-all leading-relaxed">
          {step.command}
        </pre>
      )}

      {step.rationale && (
        <p className="text-gray-400 text-xs mb-3 leading-relaxed">{step.rationale}</p>
      )}

      {isDone && step.result && (
        <div className="mt-2 space-y-1.5 text-xs font-mono">
          {step.result.blocked && (
            <div className="text-red-400 bg-red-900/20 rounded p-2">
              BLOCKED: {step.result.reason}
              {(step.result.warnings || []).map((w, i) => (
                <div key={i} className="text-red-300 mt-0.5">⚠ {w}</div>
              ))}
            </div>
          )}
          {!step.result.blocked && step.result.stdout && (
            <div className="text-gray-300 bg-black/30 rounded p-2 max-h-28 overflow-y-auto">
              {step.result.stdout.slice(0, 600)}
            </div>
          )}
          {!step.result.blocked && step.result.stderr && (
            <div className="text-yellow-400 bg-yellow-900/10 rounded p-2 max-h-20 overflow-y-auto">
              {step.result.stderr.slice(0, 300)}
            </div>
          )}
        </div>
      )}

      {showBtns && (
        <div className="flex items-center gap-2 mt-3">
          {editing ? (
            <>
              <button
                onClick={() => { setEditing(false); onApprove(editCmd); }}
                className="px-3 py-1.5 bg-cyan-800 hover:bg-cyan-700 text-cyan-100 text-xs font-semibold rounded transition-colors"
              >✓ Approve (edited)</button>
              <button
                onClick={() => { setEditing(false); setEditCmd(step.command); }}
                className="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 text-gray-300 text-xs rounded transition-colors"
              >Cancel</button>
            </>
          ) : (
            <>
              <button
                onClick={() => onApprove(step.command)}
                className="px-3 py-1.5 bg-green-900 hover:bg-green-800 text-green-200 text-xs font-semibold rounded transition-colors"
              >✓ Approve</button>
              <button
                onClick={() => setEditing(true)}
                className="px-3 py-1.5 bg-blue-950 hover:bg-blue-900 text-blue-300 text-xs rounded transition-colors"
              >✎ Edit</button>
              <button
                onClick={onAbort}
                className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-400 text-xs rounded transition-colors"
              >✕ Abort</button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ── Ticket List (Category A) ──────────────────────────────────────────────────

function TicketListView({ onSelect }) {
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr]         = useState(null);
  const [sortMode, setSortMode] = useState('date');

  useEffect(() => {
    apiFetch('/api/tickets/')
      .then(d => setTickets(d.tickets || []))
      .catch(e => setErr(e.message))
      .finally(() => setLoading(false));
  }, []);

  const sortedTickets = [...tickets].sort((a, b) => {
    if (sortMode === 'date') return new Date(b.created_at || Date.now()) - new Date(a.created_at || Date.now());
    if (sortMode === 'priority') {
      const p = { critical: 0, high: 1, medium: 2, low: 3 };
      return (p[(a.priority || '').toLowerCase()] ?? 9) - (p[(b.priority || '').toLowerCase()] ?? 9);
    }
    if (sortMode === 'customer') return (a.customer_name || a.customer || '').localeCompare(b.customer_name || b.customer || '');
    return 0;
  });

  if (loading) return (
    <div className="flex items-center justify-center h-64 gap-3 text-gray-500">
      <Spinner size="md" /> Loading tickets…
    </div>
  );

  return (
    <div className="p-8 max-w-5xl mx-auto">
      <div className="mb-8">
        <h1 className="text-2xl font-bold text-white tracking-tight">HERMITS</h1>
        <p className="text-gray-500 text-sm mt-1">AI Service Desk Autopilot — select a ticket to begin incident response</p>
      </div>

      <Err msg={err} />

      <div className="flex items-center gap-3 mb-4 mt-4">
        <span className="text-xs text-gray-500 font-mono uppercase tracking-wider">Sort by:</span>
        {['date', 'priority', 'customer'].map(mode => (
          <button
            key={mode}
            onClick={() => setSortMode(mode)}
            className={`px-3 py-1.5 text-xs rounded transition-colors ${
              sortMode === mode
                ? 'bg-cyan-900/50 text-cyan-300 border border-cyan-800'
                : 'bg-gray-800/50 text-gray-400 border border-gray-700 hover:bg-gray-800'
            }`}
          >
            {mode.charAt(0).toUpperCase() + mode.slice(1)}
          </button>
        ))}
      </div>

      <div className="rounded-xl border border-gray-800 overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-900/80 text-gray-500 text-left text-xs uppercase tracking-wide">
              <th className="px-5 py-3 font-medium w-16">#</th>
              <th className="px-5 py-3 font-medium">Title</th>
              <th className="px-5 py-3 font-medium">Customer</th>
              <th className="px-5 py-3 font-medium w-24">Priority</th>
              <th className="px-5 py-3 font-medium w-24">Status</th>
            </tr>
          </thead>
          <tbody>
            {sortedTickets.map(t => (
              <tr
                key={t.id}
                onClick={() => onSelect(t)}
                className="border-t border-gray-800 bg-gray-950 hover:bg-gray-900/70 cursor-pointer transition-colors group"
              >
                <td className="px-5 py-3.5 text-gray-600 font-mono text-xs">{t.id}</td>
                <td className="px-5 py-3.5">
                  <span className="text-gray-100 group-hover:text-white font-medium">{t.title || '—'}</span>
                  {t.description && (
                    <p className="text-gray-600 text-xs mt-0.5 line-clamp-1">{t.description}</p>
                  )}
                </td>
                <td className="px-5 py-3.5 text-gray-400 text-sm">
                  {t.customer_name || t.customer || t.company || '—'}
                </td>
                <td className="px-5 py-3.5">
                  <Badge
                    text={t.priority || '?'}
                    cls={PRI_CLS[(t.priority || '').toLowerCase()] || 'bg-gray-700 text-gray-400'}
                  />
                </td>
                <td className="px-5 py-3.5">
                  <Badge
                    text={t.status || '?'}
                    cls={STA_CLS[(t.status || '').toLowerCase()] || 'bg-gray-700 text-gray-400'}
                  />
                </td>
              </tr>
            ))}
            {!loading && sortedTickets.length === 0 && (
              <tr>
                <td colSpan={5} className="px-5 py-10 text-center text-gray-700">No tickets found</td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── Wizard (all phases) ───────────────────────────────────────────────────────

const WIZARD_PHASES = ['Identifying basic issue', 'Recon', 'Forming hypotheses', 'Execute', 'Validate', 'Complete'];
const WIZARD_IDX    = { phase1: 0, recon: 1, phase2: 2, execute: 3, validate: 4, complete: 5, done: 5 };

function WizardView({ ticket, onBack }) {
  const [phase,       setPhase]       = useState('phase1');
  const [status,      setStatus]      = useState('Starting Phase 1…');
  const [err,         setErr]         = useState(null);
  const [phase1,      setPhase1]      = useState(null);
  const [phase2,      setPhase2]      = useState(null);
  const [fixSteps,    setFixSteps]    = useState([]);
  const [executingIdx,setExecutingIdx]= useState(null);
  const [valResult,   setValResult]   = useState(null);
  const [notes,       setNotes]       = useState('');
  const [submitting,  setSubmitting]  = useState(false);

  const startRef    = useRef(Date.now());
  const executedRef = useRef([]);
  const decisionsRef= useRef([]);
  const allDoneRef  = useRef(false);

  // ── Phase 1 ────────────────────────────────────────────────────────────────
  const runPhase1 = useCallback(async () => {
    setPhase('phase1');
    setStatus('Generating pillar spec and capturing SSH baseline…');
    try {
      const r = await apiFetch('/api/agent/ai/phase1', {
        method: 'POST',
        body: JSON.stringify({ ticket_id: ticket.id, technician_id: 'ui-technician' }),
      });
      setPhase1(r);
      setStatus('Phase 1 complete — starting SSH reconnaissance…');
      runRecon();
    } catch (e) {
      setErr(`Phase 1 failed: ${e.message}`);
      setStatus('Phase 1 failed');
    }
  }, [ticket.id]);

  // ── Recon ──────────────────────────────────────────────────────────────────
  const runRecon = useCallback(async () => {
    setPhase('recon');
    setStatus('Running SSH reconnaissance…');
    try {
      await apiFetch('/api/agent/recon', {
        method: 'POST',
        body: JSON.stringify({ ticket_id: ticket.id }),
      });
      setStatus('Recon complete — generating hypotheses…');
    } catch (_) {
      setStatus('Recon partial — generating hypotheses anyway…');
    }
    runPhase2();
  }, [ticket.id]);

  // ── Phase 2 ────────────────────────────────────────────────────────────────
  const runPhase2 = useCallback(async () => {
    setPhase('phase2');
    setStatus('Analysing recon data and generating fix hypotheses…');
    try {
      const r = await apiFetch('/api/agent/ai/phase2', {
        method: 'POST',
        body: JSON.stringify({ ticket_id: ticket.id, technician_id: 'ui-technician' }),
      });
      setPhase2(r);
      const steps = r.best_hypothesis?.hypothesis?.fix_steps || [];
      setFixSteps(steps.map(s => ({ ...s, status: 'pending', result: null })));
      setPhase('execute');
      setStatus(`${steps.length} fix step${steps.length !== 1 ? 's' : ''} proposed — approve each command below`);
    } catch (e) {
      setErr(`Phase 2 failed: ${e.message}`);
      setStatus('Phase 2 failed');
    }
  }, [ticket.id]);

  // ── Validate ───────────────────────────────────────────────────────────────
  const runValidation = useCallback(async () => {
    setPhase('validate');
    setStatus('Running validation script on VM…');
    try {
      const r = await apiFetch('/api/agent/validate', {
        method: 'POST',
        body: JSON.stringify({ ticket_id: ticket.id }),
      });
      setValResult(r);
      setStatus(r.passed ? 'Validation PASSED ✓ — ready to submit' : 'Validation failed — review output below');
    } catch (e) {
      setValResult({ passed: false, output: e.message });
      setStatus('Validation error — proceed to submit anyway');
    }
    setPhase('complete');
  }, [ticket.id]);

  // Kick off Phase 1 on mount
  useEffect(() => { runPhase1(); }, []);

  // ── Step approval ──────────────────────────────────────────────────────────
  async function approveStep(index, command) {
    setExecutingIdx(index);
    setStatus(`Executing step ${index + 1} of ${fixSteps.length}…`);
    setFixSteps(prev => prev.map((s, i) => i === index ? { ...s, status: 'executing' } : s));

    let result = null;
    try {
      result = await apiFetch('/api/agent/execute', {
        method: 'POST',
        body: JSON.stringify({
          ticket_id: ticket.id,
          command,
          category: fixSteps[index].risk_level || 'fix',
        }),
      });
      executedRef.current.push({
        command,
        stdout: (result.stdout || '').slice(0, 300),
        stderr: (result.stderr || '').slice(0, 200),
        exit_code: result.exit_code,
      });
    } catch (e) {
      result = { blocked: true, reason: e.message };
    }

    decisionsRef.current.push([command, true]);
    setExecutingIdx(null);

    setFixSteps(prev => {
      const next = prev.map((s, i) => i === index ? { ...s, status: 'done', result } : s);
      const allProcessed = next.every(s => s.status !== 'pending' && s.status !== 'executing');
      if (allProcessed && !allDoneRef.current) {
        allDoneRef.current = true;
        setStatus('All steps processed — running validation…');
        setTimeout(runValidation, 400);
      } else {
        const nextPending = next.findIndex(s => s.status === 'pending');
        if (nextPending !== -1) setStatus(`Awaiting approval for step ${nextPending + 1}…`);
      }
      return next;
    });
  }

  function abortStep(index) {
    decisionsRef.current.push([fixSteps[index].command, false]);

    setFixSteps(prev => {
      const next = prev.map((s, i) => i === index ? { ...s, status: 'declined' } : s);
      const allProcessed = next.every(s => s.status !== 'pending' && s.status !== 'executing');
      if (allProcessed && !allDoneRef.current) {
        allDoneRef.current = true;
        setStatus('All steps processed — running validation…');
        setTimeout(runValidation, 400);
      } else {
        const nextPending = next.findIndex(s => s.status === 'pending');
        if (nextPending !== -1) setStatus(`Awaiting approval for step ${nextPending + 1}…`);
      }
      return next;
    });
  }

  // ── Submit to ERP (Category A) ─────────────────────────────────────────────
  async function submitAll() {
    setSubmitting(true);
    const elapsed = Math.max(1, Math.round((Date.now() - startRef.current) / 60000));
    const pillarAfter = {
      service_state_output:     (valResult?.output || '').slice(0, 500),
      functional_impact_output: (valResult?.output || '').slice(0, 500),
      durability_output:        (valResult?.output || '').slice(0, 500),
    };
    
    // STRICT FORMATTER: Drops milliseconds and enforces Z timezone
    const toUTCISO = (dateVal) => {
      try {
        return new Date(dateVal).toISOString().split('.')[0] + 'Z';
      } catch {
        return new Date().toISOString().split('.')[0] + 'Z';
      }
    };

    try {
      // Draft activity via AI Complete step
      const completeResp = await apiFetch('/api/agent/ai/complete', {
        method: 'POST',
        body: JSON.stringify({
          ticket_id:               ticket.id,
          chosen_hypothesis_index: 0,
          pillar_after_results:    pillarAfter,
          executed_steps:          executedRef.current,
          technician_id:           'ui-technician',
          technician_notes:        notes,
          resolution_time_minutes: elapsed,
          command_decisions:       decisionsRef.current,
        }),
      });

      const act = completeResp.activity || completeResp;

      // Strict ERP Payload Construction
      const erpPayload = {
        ticket_id:         ticket.id,
        start_datetime:    toUTCISO(act.start_datetime || startRef.current),
        end_datetime:      toUTCISO(act.end_datetime || Date.now()),
        summary:           act.summary || 'System restored via automated workflow.',
        root_cause:        act.root_cause || 'Identified during AI recon phase.',
        actions_taken:     act.actions_taken || 'Executed automated fix steps.',
        commands_summary:  act.commands_summary || executedRef.current.map(c => c.command).join('; ') || 'N/A',
        validation_result: act.validation_result || valResult?.output?.slice(0, 500) || 'Validation successful.'
      };

      // Submit to ERP
      await apiFetch('/api/activities/submit', {
        method: 'POST',
        body: JSON.stringify(erpPayload),
      });

      // Mark ticket done — will auto-refresh on the list page
      await apiFetch(`/api/tickets/${ticket.id}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status: 'done' }),
      }).catch(() => {});

      setPhase('done');
      setStatus('Submitted — ticket closed ✓');
    } catch (e) {
      setErr(`Submit failed: ${e.message}`);
    } finally {
      setSubmitting(false);
    }
  }

  const phaseIdx     = WIZARD_IDX[phase] ?? 0;
  const pendingIdx   = fixSteps.findIndex(s => s.status === 'pending');
  const isAutoPhase  = ['phase1', 'recon', 'phase2', 'validate'].includes(phase);

  return (
    <div className="flex h-screen overflow-hidden">
      {/* ── Main wizard panel ─────────────────────────────────────────────── */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">

        {/* Header */}
        <div className="flex-none bg-gray-900/80 border-b border-gray-800 px-6 py-4">
          <button
            onClick={onBack}
            className="text-xs text-gray-600 hover:text-gray-400 mb-2 flex items-center gap-1 transition-colors"
          >← All tickets</button>

          <div className="flex items-start gap-3 mb-4">
            <div className="flex-1 min-w-0">
              <h1 className="text-lg font-bold text-white truncate">{ticket.title}</h1>
              <div className="flex flex-wrap items-center gap-2 mt-1">
                <span className="text-xs text-gray-600 font-mono">#{ticket.id}</span>
                {(ticket.customer_name || ticket.customer) && (
                  <span className="text-xs text-gray-500">{ticket.customer_name || ticket.customer}</span>
                )}
                {ticket.priority && (
                  <Badge text={ticket.priority} cls={PRI_CLS[(ticket.priority || '').toLowerCase()]} />
                )}
                {ticket.status && (
                  <Badge text={ticket.status} cls={STA_CLS[(ticket.status || '').toLowerCase()]} />
                )}
              </div>
            </div>
          </div>

          {/* Phase progress bar */}
          <div className="flex items-center gap-1 mb-3">
            {WIZARD_PHASES.map((label, i) => (
              <React.Fragment key={i}>
                <div className={`flex items-center gap-1.5 text-xs whitespace-nowrap ${
                  i === phaseIdx ? 'text-cyan-400' :
                  i < phaseIdx  ? 'text-green-500' :
                                  'text-gray-700'
                }`}>
                  <div className={`w-2 h-2 rounded-full flex-none ${
                    i === phaseIdx ? 'bg-cyan-400 ring-2 ring-cyan-400/30 animate-pulse' :
                    i < phaseIdx  ? 'bg-green-600' :
                                    'bg-gray-800'
                  }`} />
                  {label}
                </div>
                {i < WIZARD_PHASES.length - 1 && (
                  <div className={`flex-1 h-px min-w-2 ${i < phaseIdx ? 'bg-green-900' : 'bg-gray-800'}`} />
                )}
              </React.Fragment>
            ))}
          </div>

          {/* Live agent status (Category D) */}
          <div className="flex items-center gap-2">
            {isAutoPhase && <Spinner />}
            {!isAutoPhase && phase !== 'done' && <span className="text-cyan-500 text-xs">●</span>}
            {phase === 'done' && <span className="text-green-500 text-xs">✓</span>}
            <span className="text-xs text-cyan-400 font-mono">{status}</span>
          </div>
        </div>

        {/* Scrollable body */}
        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-6">
          <Err msg={err} onDismiss={() => setErr(null)} />

          {/* Phase 1 results */}
          {phase1 && (
            <section>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-3">Phase 1 — Ticket Analysis</p>
              <div className="space-y-3">
                {phase1.kb_matches && phase1.kb_matches.length > 0 && (
                  <div className="rounded-lg bg-gray-800/40 border border-gray-700/60 p-4">
                    <p className="text-xs text-gray-500 mb-2.5">
                      Knowledge Base — {phase1.kb_matches.length} match{phase1.kb_matches.length !== 1 ? 'es' : ''}
                    </p>
                    <div className="space-y-2">
                      {phase1.kb_matches.slice(0, 3).map((m, i) => (
                        <div key={i} className="flex items-start gap-3 text-xs">
                          <span className="flex-none text-cyan-500 font-mono tabular-nums w-8 text-right">
                            {Math.round((m.similarity_score || 0) * 100)}%
                          </span>
                          <span className="text-gray-300">{(m.root_cause || '').slice(0, 130)}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {phase1.pillar_spec && (
                  <div className="rounded-lg bg-gray-800/40 border border-gray-700/60 p-4">
                    <p className="text-xs text-gray-500 mb-2.5">Three-Pillar Spec</p>
                    <div className="space-y-1 font-mono text-xs">
                      <p><span className="text-gray-600">service_state:     </span><span className="text-green-300">{phase1.pillar_spec.service_state_cmd}</span></p>
                      <p><span className="text-gray-600">functional_impact: </span><span className="text-green-300">{phase1.pillar_spec.functional_impact_cmd}</span></p>
                      <p><span className="text-gray-600">durability:        </span><span className="text-green-300">{phase1.pillar_spec.durability_cmd}</span></p>
                      {phase1.pillar_spec.definition_of_done && (
                        <p><span className="text-gray-600">done_when:         </span><span className="text-gray-400">{phase1.pillar_spec.definition_of_done}</span></p>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </section>
          )}

          {/* Phase 2 hypothesis */}
          {phase2 && phase2.best_hypothesis && phase2.best_hypothesis.hypothesis && (
            <section>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-3">Phase 2 — Best Hypothesis</p>
              <div className="rounded-lg bg-gray-800/40 border border-gray-700/60 p-4">
                <p className="text-white font-semibold mb-1">{phase2.best_hypothesis.hypothesis.hypothesis_title}</p>
                {phase2.best_hypothesis.hypothesis.root_cause_explanation && (
                  <p className="text-gray-400 text-sm mb-3 leading-relaxed">{phase2.best_hypothesis.hypothesis.root_cause_explanation}</p>
                )}
                {phase2.best_hypothesis.selection_rationale && (
                  <p className="text-cyan-400/80 text-xs mb-3 italic">Rationale: {phase2.best_hypothesis.selection_rationale}</p>
                )}
                {phase2.best_hypothesis.hypothesis.evidence && phase2.best_hypothesis.hypothesis.evidence.length > 0 && (
                  <div className="space-y-1">
                    {phase2.best_hypothesis.hypothesis.evidence.slice(0, 4).map((e, i) => (
                      <p key={i} className="text-xs text-gray-500">· {String(e).slice(0, 130)}</p>
                    ))}
                  </div>
                )}
                {phase2.recon_summary && (
                  <p className="text-xs text-gray-600 mt-2 italic">{phase2.recon_summary.slice(0, 200)}</p>
                )}
              </div>
            </section>
          )}

          {/* Fix steps (Category D) */}
          {fixSteps.length > 0 && (
            <section>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-3">
                Fix Steps
                {phase === 'execute' && pendingIdx !== -1 && (
                  <span className="ml-2 text-cyan-600 normal-case">
                    — {fixSteps.filter(s => s.status === 'pending').length} pending
                  </span>
                )}
              </p>
              <div className="space-y-3">
                {fixSteps.map((step, i) => (
                  <FixStepCard
                    key={i}
                    step={step}
                    index={i + 1}
                    total={fixSteps.length}
                    isActive={phase === 'execute' && i === pendingIdx}
                    anyExecuting={executingIdx !== null}
                    onApprove={cmd => approveStep(i, cmd)}
                    onAbort={() => abortStep(i)}
                  />
                ))}
              </div>
            </section>
          )}

          {/* Validation result */}
          {valResult && (
            <section>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-3">Validation</p>
              <div className={`rounded-lg border p-4 ${valResult.passed ? 'bg-green-900/15 border-green-800/60' : 'bg-red-900/15 border-red-800/60'}`}>
                <p className={`font-semibold text-sm mb-2 ${valResult.passed ? 'text-green-400' : 'text-red-400'}`}>
                  {valResult.passed ? '✓ PASSED' : '✗ FAILED'}
                </p>
                {valResult.output && (
                  <pre className="text-xs text-gray-400 font-mono whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed">
                    {valResult.output.slice(0, 2000)}
                  </pre>
                )}
              </div>
            </section>
          )}

          {/* Complete form (Category A — submit button) */}
          {phase === 'complete' && (
            <section>
              <p className="text-xs font-semibold text-gray-600 uppercase tracking-wider mb-3">Submit to ERP</p>
              <div className="rounded-lg bg-gray-800/40 border border-gray-700/60 p-4 mb-4">
                <p className="text-xs text-gray-500 mb-3">
                  Clicking Submit will draft the activity record, post it to Phoenix ERP, and close this ticket.
                </p>
                <div className="mb-4">
                  <label className="block text-xs text-gray-500 mb-1.5">Technician notes (optional)</label>
                  <textarea
                    className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-gray-200 text-sm resize-y focus:outline-none focus:border-cyan-700 transition-colors"
                    rows={3}
                    placeholder="Add any observations or additional context…"
                    value={notes}
                    onChange={e => setNotes(e.target.value)}
                  />
                </div>
                <div className="flex items-center gap-4">
                  <button
                    onClick={submitAll}
                    disabled={submitting}
                    className="flex items-center gap-2 px-5 py-2.5 bg-cyan-800 hover:bg-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm rounded-lg transition-colors"
                  >
                    {submitting ? <><Spinner /> Submitting…</> : '⬆ Submit to ERP'}
                  </button>
                  <span className="text-xs text-gray-600">
                    {executedRef.current.length} command{executedRef.current.length !== 1 ? 's' : ''} executed ·{' '}
                    {Math.max(1, Math.round((Date.now() - startRef.current) / 60000))} min
                  </span>
                </div>
              </div>
            </section>
          )}

          {/* Done */}
          {phase === 'done' && (
            <section>
              <div className="rounded-xl bg-green-900/20 border border-green-800/50 p-8 text-center">
                <div className="text-5xl mb-3">✓</div>
                <p className="text-green-400 font-bold text-xl">Ticket Closed</p>
                <p className="text-gray-500 text-sm mt-2">Activity submitted to Phoenix ERP successfully.</p>
                <button
                  onClick={onBack}
                  className="mt-6 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm rounded-lg transition-colors"
                >← Back to tickets</button>
              </div>
            </section>
          )}
        </div>
      </div>

      {/* ── Audit log sidebar (Category C) ───────────────────────────────── */}
      <div className="w-72 flex-none">
        <AuditLog ticketId={ticket.id} />
      </div>
    </div>
  );
}

// ── App root ──────────────────────────────────────────────────────────────────

function App() {
  const [ticket, setTicket] = useState(null);

  return ticket
    ? <WizardView ticket={ticket} onBack={() => setTicket(null)} />
    : <TicketListView onSelect={setTicket} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
