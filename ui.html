<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HERMITS — Incident Response</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #020617;
      --surface:     #0f172a;
      --card:        #1e293b;
      --border:      rgba(51,65,85,0.6);
      --cyan:        #22d3ee;
      --cyan-dim:    rgba(34,211,238,0.15);
      --cyan-border: rgba(34,211,238,0.35);
      --text:        #f1f5f9;
      --muted:       #94a3b8;
      --dimmer:      #475569;
      --red:         #f87171;
      --amber:       #fbbf24;
      --green:       #4ade80;
      --purple:      #c084fc;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ── */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px; height: 48px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(2,6,23,0.98));
    }
    .logo     { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--cyan); letter-spacing: 0.06em; }
    .sep      { color: var(--dimmer); }
    .subtitle { color: var(--muted); font-size: 12px; }
    .spacer   { flex: 1; }
    .refresh-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'JetBrains Mono', monospace; transition: all .15s;
    }
    .refresh-btn:hover { border-color: var(--cyan-border); color: var(--cyan); }

    /* ── Main layout ── */
    main { display: flex; flex: 1; overflow: hidden; }

    /* ── Left: ticket list ── */
    #sidebar {
      width: 340px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .sort-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.8);
    }
    .sort-bar label { font-size: 11px; color: var(--dimmer); font-family: 'JetBrains Mono', monospace; margin-right: 4px; }
    .sort-btn {
      padding: 3px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
      border: 1px solid transparent; background: rgba(30,41,59,0.6);
      color: var(--dimmer); font-family: 'Inter', sans-serif; transition: all .15s;
    }
    .sort-btn:hover  { background: rgba(51,65,85,0.6); color: var(--text); }
    .sort-btn.active { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan-border); }

    #ticket-list { flex: 1; overflow-y: auto; padding: 8px; }
    #ticket-list::-webkit-scrollbar       { width: 4px; }
    #ticket-list::-webkit-scrollbar-thumb { background: var(--card); border-radius: 2px; }

    .loading-msg { text-align: center; padding: 32px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--cyan); }
    .error-msg   { text-align: center; padding: 32px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--red); }
    .empty-msg   { text-align: center; padding: 32px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dimmer); }

    /* ── Ticket card ── */
    .ticket-card {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card);
      margin-bottom: 6px; transition: all .15s;
    }
    .ticket-card:hover  { border-color: rgba(71,85,105,0.9); background: rgba(30,41,59,0.9); }
    .ticket-card.active { border-color: var(--cyan-border); background: rgba(34,211,238,0.05); }

    .card-top  { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .ticket-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--cyan); }
    .card-spacer { flex: 1; }

    .status-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .status-OPEN        { background: rgba(251,191,36,0.15); color: var(--amber); border: 1px solid rgba(251,191,36,0.3); }
    .status-DONE        { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
    .status-IN_PROGRESS { background: rgba(192,132,252,0.12); color: var(--purple); border: 1px solid rgba(192,132,252,0.3); }
    .status-other       { background: rgba(71,85,105,0.3); color: var(--muted); border: 1px solid rgba(71,85,105,0.5); }

    .card-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; line-height: 1.35; }
    .card-meta  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .customer-name { font-size: 11px; color: var(--muted); }

    .priority-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; }
    .pri-critical { background: rgba(248,113,113,0.15); color: var(--red);   border: 1px solid rgba(248,113,113,0.3); }
    .pri-high     { background: rgba(251,191,36,0.15);  color: var(--amber); border: 1px solid rgba(251,191,36,0.3); }
    .pri-medium   { background: rgba(34,211,238,0.1);   color: var(--cyan);  border: 1px solid rgba(34,211,238,0.2); }
    .pri-low      { background: rgba(71,85,105,0.3);    color: var(--muted); border: 1px solid rgba(71,85,105,0.5); }

    .card-date { font-size: 10px; color: var(--dimmer); font-family: 'JetBrains Mono', monospace; margin-left: auto; }

    /* ── Right: detail panel ── */
    #detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

    .detail-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
    }
    .detail-empty .icon { font-size: 36px; opacity: .2; }
    .detail-empty p { color: var(--dimmer); font-size: 13px; font-family: 'JetBrains Mono', monospace; }

    .detail-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; }
    .detail-scroll::-webkit-scrollbar       { width: 4px; }
    .detail-scroll::-webkit-scrollbar-thumb { background: var(--card); border-radius: 2px; }

    /* ── Detail header ── */
    .detail-header {
      display: flex; align-items: flex-start; gap: 14px;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .detail-id-col { display: flex; flex-direction: column; gap: 4px; }
    .detail-id    { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--cyan); }
    .detail-title { font-size: 18px; font-weight: 600; flex: 1; line-height: 1.3; }
    .detail-badges { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* ── Info grid ── */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .info-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .info-item.full { grid-column: 1 / -1; }
    .info-label { font-size: 10px; color: var(--dimmer); font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .info-value { font-size: 13px; color: var(--text); }
    .info-value.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .info-value.desc { white-space: pre-wrap; line-height: 1.55; color: var(--muted); font-size: 13px; }

    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag  { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: rgba(34,211,238,0.08); color: var(--cyan); border: 1px solid rgba(34,211,238,0.2); font-family: 'JetBrains Mono', monospace; }

    .ssh-chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(192,132,252,0.1); color: var(--purple); border: 1px solid rgba(192,132,252,0.25); }

    /* ── ERP form ── */
    .erp-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
    .erp-section h3 {
      font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--cyan);
      margin-bottom: 14px; letter-spacing: 0.06em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .erp-section h3::before { content: '//'; color: var(--dimmer); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-label {
      font-size: 10px; color: var(--dimmer); font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .form-label span { color: rgba(71,85,105,0.8); text-transform: none; letter-spacing: 0; font-size: 10px; }
    .form-input, .form-textarea {
      background: rgba(15,23,42,0.8); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 7px 10px;
      font-family: 'Inter', sans-serif; font-size: 13px;
      transition: border-color .15s; outline: none; width: 100%;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--cyan-border); }
    .form-input::placeholder, .form-textarea::placeholder { color: rgba(71,85,105,0.8); }
    .form-textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

    .form-actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }

    .btn {
      padding: 8px 18px; border-radius: 7px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1px solid; transition: all .15s;
      font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-primary { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan-border); }
    .btn-primary:hover:not(:disabled) { background: rgba(34,211,238,0.25); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { background: var(--card); color: var(--text); }

    .submit-result {
      font-size: 12px; padding: 8px 12px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; margin-top: 10px;
    }
    .res-ok    { background: rgba(74,222,128,0.1);  color: var(--green);  border: 1px solid rgba(74,222,128,0.25); }
    .res-error { background: rgba(248,113,113,0.1); color: var(--red);    border: 1px solid rgba(248,113,113,0.25); }
    .res-info  { background: var(--cyan-dim);       color: var(--cyan);   border: 1px solid var(--cyan-border); }

    .spin {
      width: 14px; height: 14px; border: 2px solid rgba(34,211,238,0.2);
      border-top-color: var(--cyan); border-radius: 50%;
      animation: spin .6s linear infinite; display: inline-block; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .detail-loading {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 40px; color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 12px;
    }
    .detail-loading .spin { width: 18px; height: 18px; }
  </style>
</head>
<body>

<header>
  <span class="logo">HERMITS</span>
  <span class="sep">—</span>
  <span class="subtitle">Incident Response Desk</span>
  <div class="spacer"></div>
  <button class="refresh-btn" onclick="loadTickets()">↻ Refresh</button>
</header>

<main>
  <!-- LEFT: ticket list -->
  <nav id="sidebar">
    <div class="sort-bar">
      <label>sort:</label>
      <button class="sort-btn active" data-sort="date"     onclick="setSort('date')">Date</button>
      <button class="sort-btn"        data-sort="priority" onclick="setSort('priority')">Priority</button>
      <button class="sort-btn"        data-sort="customer" onclick="setSort('customer')">Customer</button>
    </div>
    <div id="ticket-list">
      <div class="loading-msg">loading tickets…</div>
    </div>
  </nav>

  <!-- RIGHT: detail panel -->
  <section id="detail">
    <div class="detail-empty" id="detail-empty">
      <div class="icon">◈</div>
      <p>select a ticket to view details</p>
    </div>
    <div class="detail-scroll" id="detail-panel" style="display:none"></div>
  </section>
</main>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
// When opened directly via file:// or from a different origin, point at the backend.
// When served by the backend itself (same origin), use relative paths.
const API = (window.location.protocol === 'file:' ||
             (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1'))
  ? 'http://localhost:8000'
  : '';

// ── State ──────────────────────────────────────────────────────────────────
let allTickets     = [];
let sortMode       = 'date';
let activeTicketId = null;
let sessionStart   = null;   // set when a ticket is opened, used as start_datetime default

// ── Priority order for sorting ─────────────────────────────────────────────
const PRI = { critical: 0, high: 1, medium: 2, low: 3 };
function priRank(p) { return PRI[(p || '').toLowerCase()] ?? 9; }

// ── Sort ───────────────────────────────────────────────────────────────────
function sorted(list) {
  const copy = [...list];
  if (sortMode === 'date') {
    copy.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  } else if (sortMode === 'priority') {
    copy.sort((a, b) => priRank(a.priority) - priRank(b.priority));
  } else if (sortMode === 'customer') {
    copy.sort((a, b) => (a.customer_name || '').localeCompare(b.customer_name || ''));
  }
  return copy;
}

function setSort(mode) {
  sortMode = mode;
  document.querySelectorAll('.sort-btn').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.sort === mode)
  );
  renderList();
}

// ── Load ticket list ───────────────────────────────────────────────────────
async function loadTickets() {
  const el = document.getElementById('ticket-list');
  el.innerHTML = '<div class="loading-msg">loading tickets…</div>';
  try {
    const res  = await fetch(`${API}/api/tickets/`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allTickets  = Array.isArray(data) ? data : (data.tickets ?? []);
    renderList();
  } catch (e) {
    el.innerHTML = `<div class="error-msg">failed to load<br><small>${esc(e.message)}</small></div>`;
  }
}

// ── Render ticket list ─────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('ticket-list');
  const list = sorted(allTickets);
  if (!list.length) {
    el.innerHTML = '<div class="empty-msg">no tickets found</div>';
    return;
  }
  el.innerHTML = list.map(cardHTML).join('');
}

function statusClass(status) {
  const s = (status || '').toUpperCase();
  if (s === 'OPEN')        return 'status-OPEN';
  if (s === 'DONE')        return 'status-DONE';
  if (s === 'IN_PROGRESS') return 'status-IN_PROGRESS';
  return 'status-other';
}

function priClass(priority) {
  const p = (priority || 'low').toLowerCase();
  return { critical: 'pri-critical', high: 'pri-high', medium: 'pri-medium', low: 'pri-low' }[p] || 'pri-low';
}

function cardHTML(t) {
  const active = t.id === activeTicketId ? ' active' : '';
  return `<div class="ticket-card${active}" onclick="openTicket(${t.id})" id="card-${t.id}">
    <div class="card-top">
      <span class="ticket-id">#${t.id}</span>
      <div class="card-spacer"></div>
      <span class="status-badge ${statusClass(t.status)}" id="list-badge-${t.id}">${esc((t.status||'OPEN').toUpperCase())}</span>
    </div>
    <div class="card-title">${esc(t.title)}</div>
    <div class="card-meta">
      <span class="customer-name">${esc(t.customer_name || '')}</span>
      <span class="priority-badge ${priClass(t.priority)}">${esc((t.priority||'low').toLowerCase())}</span>
      <span class="card-date">${fmtDate(t.created_at)}</span>
    </div>
  </div>`;
}

// ── Open ticket: fetch + display details ───────────────────────────────────
async function openTicket(id) {
  activeTicketId = id;
  sessionStart   = new Date().toISOString();

  // Highlight active card without full re-render
  document.querySelectorAll('.ticket-card').forEach(el => {
    el.classList.toggle('active', el.id === `card-${id}`);
  });

  document.getElementById('detail-empty').style.display = 'none';
  const panel = document.getElementById('detail-panel');
  panel.style.display = 'block';
  panel.innerHTML = '<div class="detail-loading"><span class="spin"></span>fetching ticket…</div>';

  try {
    // Use auto_run_pipeline=false to get a fast response
    const res = await fetch(`${API}/api/tickets/${id}?auto_run_pipeline=false`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data   = await res.json();
    const ticket = data.ticket ?? data;
    const system = data.system?.system ?? {};
    renderDetail(ticket, system);
  } catch (e) {
    panel.innerHTML = `<div style="padding:20px"><div class="submit-result res-error">
      Failed to fetch ticket #${id}: ${esc(e.message)}
    </div></div>`;
  }
}

// ── Render detail panel ────────────────────────────────────────────────────
function renderDetail(ticket, system) {
  const panel    = document.getElementById('detail-panel');
  const pri      = (ticket.priority || 'low').toLowerCase();
  const stat     = (ticket.status   || 'OPEN').toUpperCase();
  const tags     = (ticket.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const sshHost  = system.ip       || ticket.ssh_host || '';
  const sshUser  = system.username || ticket.ssh_user || '';
  const sshPort  = system.port     || ticket.ssh_port || 22;

  // Default datetime values for the ERP form
  const startVal = toDatetimeLocal(sessionStart || new Date().toISOString());
  const endVal   = toDatetimeLocal(new Date().toISOString());

  panel.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-id">#${ticket.id}</div>
        <div class="detail-title">${esc(ticket.title)}</div>
      </div>
      <div class="detail-badges">
        <span class="priority-badge ${priClass(pri)}">${pri}</span>
        <span class="status-badge ${statusClass(stat)}" id="detail-badge-${ticket.id}">${stat}</span>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Customer</div>
        <div class="info-value">${esc(ticket.customer_name || '')} <span style="color:var(--dimmer);font-size:11px">(#${ticket.customer_id})</span></div>
      </div>
      <div class="info-item">
        <div class="info-label">Priority / Status</div>
        <div class="info-value" style="display:flex;gap:8px;align-items:center">
          <span class="priority-badge ${priClass(pri)}">${pri}</span>
          <span class="status-badge ${statusClass(stat)}">${stat}</span>
        </div>
      </div>
      <div class="info-item">
        <div class="info-label">Created</div>
        <div class="info-value mono">${fmtDateFull(ticket.created_at)}</div>
      </div>
      <div class="info-item">
        <div class="info-label">SLA Due</div>
        <div class="info-value mono">${ticket.sla_due_at ? fmtDateFull(ticket.sla_due_at) : '—'}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Service Hint</div>
        <div class="info-value mono">${esc(ticket.service_hint || '—')}</div>
      </div>
      ${sshHost ? `
      <div class="info-item">
        <div class="info-label">SSH Access</div>
        <div><span class="ssh-chip">${esc(sshUser)}@${esc(sshHost)}:${sshPort}</span></div>
      </div>` : '<div class="info-item"><div class="info-label">SSH Access</div><div class="info-value mono" style="color:var(--dimmer)">—</div></div>'}
      <div class="info-item full">
        <div class="info-label">Description</div>
        <div class="info-value desc">${esc(ticket.description || '—')}</div>
      </div>
      ${tags ? `<div class="info-item full"><div class="info-label">Tags</div><div class="tags">${tags}</div></div>` : ''}
    </div>

    <!-- ERP Activity Submission -->
    <div class="erp-section">
      <h3>ERP Activity Submission</h3>

      <div class="form-row" style="margin-bottom:10px">
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">start_datetime</label>
          <input class="form-input" type="datetime-local" id="f-start-${ticket.id}" value="${startVal}" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label">end_datetime</label>
          <input class="form-input" type="datetime-local" id="f-end-${ticket.id}" value="${endVal}" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">summary <span>— one sentence: what was restored</span></label>
        <input class="form-input" type="text" id="f-summary-${ticket.id}"
          placeholder="Restored the API service by correcting the misconfigured environment variable." />
      </div>
      <div class="form-group">
        <label class="form-label">root_cause <span>— technical cause, not the symptom</span></label>
        <textarea class="form-textarea" id="f-root-${ticket.id}" rows="2"
          placeholder="DATABASE_URL was pointing to the wrong host after the migration."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">actions_taken <span>— diagnosis and fix steps in order</span></label>
        <textarea class="form-textarea" id="f-actions-${ticket.id}" rows="3"
          placeholder="1. Ran journalctl to identify the error.&#10;2. Inspected /etc/app.env.&#10;3. Updated DATABASE_URL and restarted the service."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">commands_summary <span>— relevant commands, no secrets</span></label>
        <textarea class="form-textarea" id="f-cmds-${ticket.id}" rows="2"
          placeholder="journalctl -u app; cat /etc/app.env; sed -i ... /etc/app.env; systemctl restart app"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">validation_result <span>— concrete proof customer benefit is restored</span></label>
        <textarea class="form-textarea" id="f-validation-${ticket.id}" rows="2"
          placeholder="Public test script returned PASS. curl /health returns HTTP 200. Upload test succeeds."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="submit-btn-${ticket.id}" onclick="submitERP(${ticket.id})">
          Submit to ERP
        </button>
        <button class="btn btn-ghost" onclick="setEndNow(${ticket.id})">Set end = now</button>
      </div>
      <div id="submit-result-${ticket.id}" style="display:none" class="submit-result"></div>
    </div>
  `;
}

// ── Submit ERP activity ────────────────────────────────────────────────────
async function submitERP(ticketId) {
  const g   = field => document.getElementById(`${field}-${ticketId}`);
  const btn = document.getElementById(`submit-btn-${ticketId}`);
  const res = document.getElementById(`submit-result-${ticketId}`);

  const startRaw  = g('f-start')?.value;
  const endRaw    = g('f-end')?.value;
  const summary   = g('f-summary')?.value?.trim();
  const rootCause = g('f-root')?.value?.trim();
  const actions   = g('f-actions')?.value?.trim();
  const commands  = g('f-cmds')?.value?.trim();
  const valResult = g('f-validation')?.value?.trim();

  if (!startRaw || !endRaw || !summary || !rootCause || !actions || !commands || !valResult) {
    showResult(res, 'res-error', 'All fields are required before submitting to ERP.');
    return;
  }

  // Exact format required by ERP — datetime as UTC ISO 8601 with Z suffix
  const payload = {
    ticket_id:         ticketId,
    start_datetime:    toUTCISO(startRaw),
    end_datetime:      toUTCISO(endRaw),
    summary:           summary,
    root_cause:        rootCause,
    actions_taken:     actions,
    commands_summary:  commands,
    validation_result: valResult,
  };

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Submitting…';
  showResult(res, 'res-info', 'Submitting activity to ERP…');

  try {
    const r = await fetch(`${API}/api/activities/submit`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(payload),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }

    // ERP submission succeeded → update ticket status to DONE
    await markTicketDone(ticketId);

    btn.innerHTML = '✓ Submitted';
    showResult(res, 'res-ok', `✓ Activity submitted. Ticket #${ticketId} marked DONE.`);

  } catch (e) {
    btn.disabled  = false;
    btn.innerHTML = 'Submit to ERP';
    showResult(res, 'res-error', `Submission failed: ${esc(e.message)}`);
  }
}

// ── Mark ticket DONE after successful ERP submission ───────────────────────
async function markTicketDone(ticketId) {
  try {
    await fetch(`${API}/api/tickets/${ticketId}/status`, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ status: 'DONE' }),
    });
  } catch {
    // best-effort — ERP submission already succeeded
  }

  // Update local state
  const t = allTickets.find(x => x.id === ticketId);
  if (t) t.status = 'DONE';

  // Update status badge in detail header
  const detailBadge = document.getElementById(`detail-badge-${ticketId}`);
  if (detailBadge) {
    detailBadge.textContent = 'DONE';
    detailBadge.className   = 'status-badge status-DONE';
  }

  // Update status badge in the ticket list card
  const listBadge = document.getElementById(`list-badge-${ticketId}`);
  if (listBadge) {
    listBadge.textContent = 'DONE';
    listBadge.className   = 'status-badge status-DONE';
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setEndNow(ticketId) {
  const el = document.getElementById(`f-end-${ticketId}`);
  if (el) el.value = toDatetimeLocal(new Date().toISOString());
}

// datetime-local input value from ISO string (local time, no seconds)
function toDatetimeLocal(iso) {
  const d   = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// datetime-local value → UTC ISO 8601 string ending in Z
function toUTCISO(datetimeLocal) {
  return new Date(datetimeLocal).toISOString();
}

function showResult(el, cls, msg) {
  el.style.display = 'block';
  el.className     = `submit-result ${cls}`;
  el.textContent   = msg;
}

function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' }); }
  catch { return ''; }
}

function fmtDateFull(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('en-GB', {
      day:'2-digit', month:'short', year:'numeric',
      hour:'2-digit', minute:'2-digit', hour12: false,
    });
  } catch { return iso; }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadTickets();
</script>
