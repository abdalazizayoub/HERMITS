services:

  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./keys:/app/keys:ro
      - ./data:/app/data
      - ./audit_logs:/app/audit_logs
    restart: unless-stopped

  ui:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./ui.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    restart: unless-stopped
